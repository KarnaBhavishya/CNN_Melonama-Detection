<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Melanoma Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {background: #f5f7fa;}
        .card {box-shadow: 0 4px 8px rgba(0,0,0,0.2);}
        .upload-btn {background: #4CAF50; color: white;}
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center text-primary">Melanoma Detection Dashboard</h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Upload Skin Lesion Image</label>
                    <input class="form-control" type="file" name="image" required>
                </div>
                <button type="submit" class="btn upload-btn w-100">Predict</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
